<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="Parmenides: Finding Your Way — temple and uppercase Greek pi"><rect width="1280" height="480" fill="#2a2a2a"/><g transform="translate(35 30) scale(.8)">
  <rect width="512" height="512" fill="#2a2a2a"/>

  <!-- Triangular pediment (translucent fill + stroke) -->
  <polygon points="72,230 256,112 440,230" fill="#e8e2d4" fill-opacity="0.08" stroke="#e8e2d4" stroke-width="6" stroke-linejoin="round"/>

  <!-- Central arch in burnished gold (accent) -->
  <path d="M 210 228 Q 256 158, 302 228 L 302 232 L 210 232 Z" fill="#d6ac40"/>

  <!-- Architrave (cross-beam) -->
  <rect x="72" y="230" width="368" height="22" fill="#e8e2d4"/>

  <!-- Four columns -->
  <g fill="#e8e2d4">
    <rect x="104" y="252" width="44" height="184"/>
    
    
    <rect x="366" y="252" width="44" height="184"/>
  </g>

  <text x="256" y="416" text-anchor="middle" font-family="DejaVu Serif, serif" font-weight="bold" font-size="220" fill="#d6ac40">Π</text>
  <!-- Stylobate (stepped base) -->
  <rect x="80" y="436" width="352" height="22" fill="#e8e2d4"/>
  <rect x="66" y="458" width="380" height="12" fill="#e8e2d4" fill-opacity="0.55"/>
</g><text x="490" y="180" font-family="DejaVu Sans, sans-serif" font-size="30" letter-spacing="8" fill="#d6ac40">PARMENIDES</text><text x="490" y="257" font-family="DejaVu Serif, serif" font-size="50" fill="#e8e2d4">Finding Your Way</text><text x="492" y="305" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#e8e2d4">LOVE · REASON · TRUTH · GOD</text></svg>
