<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">Visitor flow from catalogue to a working tray</title>
  <desc id="desc">Catalogue card leads to Indri product page; visitor checks supported platform and downloads a GitHub release; then verifies archive, runs installer, loads Chrome extension, opens Board Game Arena, and sees tray title.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f5f0e8;font-size:17px}.small{font-size:13px;fill:#c8c0b8}.head{font-size:17px;font-weight:bold}.green{fill:#b8ef00}.dark{fill:#3d3833}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#b8ef00"/></marker></defs>
  <rect width="1180" height="420" fill="#3d3833"/>
  <text x="38" y="43" class="green head">VISITOR FLOW</text>
  <rect x="37" y="76" width="200" height="105" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="58" y="111" class="head">Indri catalogue</text><text x="58" y="138" class="small">BGA Title Tray card</text>
  <path d="M239 128 H274" stroke="#b8ef00" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="278" y="76" width="220" height="105" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="297" y="111" class="head">Product page</text><text x="297" y="138" class="small">Real screenshot + platform fit</text>
  <path d="M500 128 H535" stroke="#b8ef00" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="539" y="76" width="220" height="105" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="558" y="111" class="head">GitHub release</text><text x="558" y="138" class="small">Archive + adjacent checksum</text>
  <path d="M761 128 H796" stroke="#b8ef00" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="800" y="76" width="340" height="105" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="819" y="111" class="head">Illustrated package guide</text><text x="819" y="138" class="small">START_HERE.html in extracted archive</text>
  <path d="M969 183 V203 H388 V218" fill="none" stroke="#b8ef00" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="800" y="223" width="340" height="139" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="819" y="257" class="head">Working KDE tray</text>
  <text x="819" y="286" class="small">Open or refresh BGA tab</text>
  <text x="819" y="311" class="small">See title; click to focus</text>
  <text x="819" y="336" class="small">Offer flashes until state/focus changes</text>
  <path d="M761 291 H795" stroke="#b8ef00" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="539" y="223" width="220" height="139" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="558" y="257" class="head">Chrome extension</text>
  <text x="558" y="286" class="small">chrome://extensions/</text>
  <text x="558" y="311" class="small">Developer mode</text>
  <text x="558" y="336" class="small">Load unpacked folder</text>
  <path d="M500 291 H535" stroke="#b8ef00" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="278" y="223" width="220" height="139" rx="7" fill="#4a4641" stroke="#b8ef00"/>
  <text x="297" y="257" class="head">Local installation</text>
  <text x="297" y="286" class="small">Verify SHA-256</text>
  <text x="297" y="311" class="small">Extract archive</text>
  <text x="297" y="336" class="small">Run install.sh</text>
  <text x="40" y="396" class="small">Reading direction: top row left → right, then lower row left → right; arrows in lower row indicate stage order from local install to extension to tray.</text>
</svg>
