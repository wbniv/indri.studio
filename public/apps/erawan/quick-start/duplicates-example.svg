<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 392" role="img" aria-labelledby="title"><title id="title">Three identical files form a verified group; leave unchanged, link, or delete reviewed copies</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1080" height="392" rx="14" fill="#f5f7fb" stroke="none"/><text x="32" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#50647e" font-weight="700">DUPLICATES: SAME BYTES CAN HAVE DIFFERENT NAMES</text><rect x="24" y="66" width="320" height="112" rx="14" fill="#fff" stroke="#dce3ee"/><text x="40" y="99" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400">photos/</text><text x="40" y="129" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#24364b" font-weight="400">beach.jpg</text><text x="40" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#007f86" font-weight="400">same full SHA-256</text><rect x="380" y="66" width="320" height="112" rx="14" fill="#fff" stroke="#dce3ee"/><text x="396" y="99" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400">downloads/</text><text x="396" y="129" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#24364b" font-weight="400">holiday.jpg</text><text x="396" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#007f86" font-weight="400">same full SHA-256</text><rect x="736" y="66" width="320" height="112" rx="14" fill="#fff" stroke="#dce3ee"/><text x="752" y="99" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#64748b" font-weight="400">old-drive/</text><text x="752" y="129" font-family="DejaVu Sans Mono,monospace" font-size="20" fill="#24364b" font-weight="400">beach-copy.jpg</text><text x="752" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#007f86" font-weight="400">same full SHA-256</text><text x="32" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245ec7" font-weight="700">Scan → inspect the group → choose the kept copy → save a reviewed report</text><rect x="24" y="242" width="320" height="88" rx="14" fill="#fff" stroke="#dce3ee"/><text x="40" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#50647e" font-weight="700">Leave unmarked</text><text x="40" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#50647e" font-weight="400">Keep all copies as they are.</text><rect x="380" y="242" width="320" height="88" rx="14" fill="#fff" stroke="#dce3ee"/><text x="396" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#007f86" font-weight="700">Link</text><text x="396" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#007f86" font-weight="400">Share data blocks; linked files are read-only.</text><rect x="736" y="242" width="320" height="88" rx="14" fill="#fff" stroke="#dce3ee"/><text x="752" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#b54561" font-weight="700">Delete</text><text x="752" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#b54561" font-weight="400">Remove reviewed extra copies; keeper stays.</text><text x="32" y="367" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#50647e" font-weight="400">The scan changes nothing. Preview with --dry-run before applying marked actions.</text></svg>
