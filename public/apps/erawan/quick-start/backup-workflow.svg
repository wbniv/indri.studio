<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" role="img" aria-labelledby="title"><title id="title">Choose source and destination, preview, watch, then check completed status</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect x="0" y="0" width="1080" height="320" rx="14" fill="#f5f7fb" stroke="none"/><text x="32" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#50647e" font-weight="700">BACKUP: THE SCREEN IS PART OF THE WORKFLOW</text><rect x="24" y="68" width="246" height="132" rx="14" fill="#fff" stroke="#dce3ee"/><text x="41" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#007f86" font-weight="700">1  Choose</text><text x="41" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#24364b" font-weight="400">Source + dedicated destination</text><text x="41" y="168" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#50647e" font-weight="400">wizard</text><path d="M271 133 L289 133" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="291" y="68" width="246" height="132" rx="14" fill="#fff" stroke="#dce3ee"/><text x="308" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#245ec7" font-weight="700">2  Preview</text><text x="308" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#24364b" font-weight="400">Read the plan before running</text><text x="308" y="168" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#50647e" font-weight="400">backup plan</text><path d="M538 133 L556 133" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="558" y="68" width="246" height="132" rx="14" fill="#fff" stroke="#dce3ee"/><text x="575" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#007f86" font-weight="700">3  Watch</text><text x="575" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#24364b" font-weight="400">Follow copy and verification</text><text x="575" y="168" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#50647e" font-weight="400">backup watch</text><path d="M805 133 L823 133" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="825" y="68" width="246" height="132" rx="14" fill="#fff" stroke="#dce3ee"/><text x="842" y="101" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#245ec7" font-weight="700">4  Finish</text><text x="842" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#24364b" font-weight="400">Check the completed status</text><text x="842" y="168" font-family="DejaVu Sans Mono,monospace" font-size="15" fill="#50647e" font-weight="400">backup status</text><rect x="24" y="223" width="1032" height="71" rx="14" fill="#e5f4f1" stroke="none"/><text x="44" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#00665f" font-weight="700">Watch both stages: copying bytes is followed by destination verification.</text><text x="44" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#00665f" font-weight="400">Leaving the watcher keeps the backup running. The wizard itself starts no backup.</text></svg>
