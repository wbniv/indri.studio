<svg xmlns="http://www.w3.org/2000/svg" width="640" height="244" viewBox="0 0 640 244" role="img" aria-labelledby="title desc"><title id="title">Compact meshes and parallel culling</title><desc id="desc">Baked compatible vertices occupy 28 bytes. The 32-bit ARM NEON path tests four triangle faces together.</desc><rect width="640" height="244" rx="16" fill="#45403b"/><g font-family="system-ui, sans-serif"><text x="26" y="40" fill="#b8ef00" font-size="21" text-anchor="start">COMPACT BAKED GEOMETRY</text><rect x="22" y="62" width="185" height="118" rx="12" fill="#3d3833"/><text x="114" y="111" fill="#b8ef00" font-size="48" text-anchor="middle">28</text><text x="114" y="151" fill="#c8c0b8" font-size="21" text-anchor="middle">bytes / vertex</text><rect x="225" y="62" width="393" height="118" rx="12" fill="#3d3833"/><path d="M250 130 L277 82 L304 130 Z" fill="none" stroke="#b8ef00" stroke-width="2"/><path d="M335 130 L362 82 L389 130 Z" fill="none" stroke="#b8ef00" stroke-width="2"/><path d="M420 130 L447 82 L474 130 Z" fill="none" stroke="#b8ef00" stroke-width="2"/><path d="M505 130 L532 82 L559 130 Z" fill="none" stroke="#b8ef00" stroke-width="2"/><text x="421" y="161" fill="#f5f0e8" font-size="22" text-anchor="middle">4 faces per ARM NEON test</text><text x="320" y="218" fill="#c8c0b8" font-size="22" text-anchor="middle">Compatible meshes · fallback retained</text></g></svg>